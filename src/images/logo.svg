<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">

  <!-- Gradient -->
  <defs>
    <linearGradient id="animatedGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9AE4CB">
        <animate attributeName="stop-color" values="#9AE4CB; #4CA8DD; #085078; #9AE4CB" dur="6s" repeatCount="indefinite"></animate>
      </stop>
      <stop offset="100%" stop-color="#085078">
        <animate attributeName="stop-color" values="#085078; #292F91; #4CA8DD; #085078" dur="6s" repeatCount="indefinite"></animate>
      </stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#animatedGradient)"></rect>

  <!-- Animated S -->
  <path d="M115 60
       C115 50 85 50 85 70
       C85 90 120 80 120 110
       C120 140 80 140 80 120" stroke="white" stroke-width="12" stroke-linecap="round" fill="none" stroke-dasharray="300" stroke-dashoffset="300">

    <!-- Draw animation -->
    <animate attributeName="stroke-dashoffset" from="300" to="0" dur="1.8s" fill="freeze"></animate>
  </path>
</svg>
